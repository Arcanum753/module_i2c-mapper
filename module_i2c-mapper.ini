#------------------------- esp32 + i2c-mapper -------------------------
[env:esp32-i2c-mapper]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_i2c-mapper/> +<module_udp/> +<module_bmp280/> +<module_ccs811/> +<module_hdc1080/> +<module_macros/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_I2C_MAPPER
	-D DEBUG_BMP280=1
	-D DEBUG_CCS811=1
	-D DEBUG_HDC1080=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}
; Плата на тестовом стенде (uPesy ESP32 Wroom, CH340) не входит в download mode
; автоматически по DTR/RTS (нет состояния «EN high + GPIO0 low»). Прошивать после
; ручного BOOT+EN; before_reset=no_reset не сбрасывает чип из загрузчика.
board_upload.before_reset = no_reset
upload_speed = 460800

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_i2c_mapper
define = MODULE_I2C_MAPPER
web = 1
loop = 0
